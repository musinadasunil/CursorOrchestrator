[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-orchestrator"
version = "0.1.0"
description = "Prompt -> plan -> build -> review -> PR -> babysit orchestrator, never auto-merges."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
cursor-orchestrator = "cursor_orchestrator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cursor_orchestrator = ["pr_template.md", "config.yaml"]
